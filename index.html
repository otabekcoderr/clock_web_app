<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock SuperApp</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="app-title hidden">
        <h1 class="title">Clock</h1>
      </div>

      <div class="num-container hidden">
        <div class="num-wrapper"><h3 class="num"></h3></div>
      </div>

      <div class="timer-tile app-title">
        <h1 class="title">Timer</h1>
      </div>

      <div class="timer-container num-container">
        <div class="timer-wrapper num-wrapper">
            <h3 class="timer-num"></h3>
        </div>
      </div>

      <div class="menu-wrapper">

      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
